name: Publish Package to GitHub Packages

on:
  release:
    types: [created]
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ts-socketio'
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      
      - name: Build packages
        run: yarn build

      - name: Get version
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            # For releases, use the tag version if it exists
            TAG_VERSION=${GITHUB_REF#refs/tags/}
            if [[ $TAG_VERSION == v* ]]; then
              echo "VERSION=${TAG_VERSION#v}" >> $GITHUB_OUTPUT
            else
              # If no version in tag, increment minor version
              CURRENT_VERSION=$(node -p "require('./package.json').version")
              # Remove any beta suffix for version calculation
              BASE_VERSION=${CURRENT_VERSION%-*}
              IFS='.' read -r major minor patch <<< "$BASE_VERSION"
              NEW_MINOR=$((minor + 1))
              echo "VERSION=${major}.${NEW_MINOR}.0" >> $GITHUB_OUTPUT
            fi
            echo "IS_RELEASE=true" >> $GITHUB_OUTPUT
          else
            # For develop branch, increment patch version
            CURRENT_VERSION=$(node -p "require('./package.json').version")
            # Remove any beta suffix for version calculation
            BASE_VERSION=${CURRENT_VERSION%-*}
            IFS='.' read -r major minor patch <<< "$BASE_VERSION"
            NEW_PATCH=$((patch + 1))
            echo "VERSION=${major}.${minor}.${NEW_PATCH}" >> $GITHUB_OUTPUT
            echo "IS_RELEASE=false" >> $GITHUB_OUTPUT
          fi

      - name: Update package versions
        run: |
          # Function to update version in package.json
          update_version() {
            local pkg_file=$1
            local new_version=$2
            # Use jq to update version without triggering npm
            jq --arg v "$new_version" '.version = $v' "$pkg_file" > "${pkg_file}.tmp"
            mv "${pkg_file}.tmp" "$pkg_file"
          }

          # Function to update dependency version
          update_dependency() {
            local pkg_file=$1
            local dep_name=$2
            local new_version=$3
            # Use jq to update dependency version
            jq --arg v "^$new_version" ".dependencies[\"$dep_name\"] = \$v" "$pkg_file" > "${pkg_file}.tmp"
            mv "${pkg_file}.tmp" "$pkg_file"
          }

          # Update root package.json
          update_version "package.json" "${{ steps.get_version.outputs.VERSION }}"
          
          # Update all package versions and their dependencies
          for pkg in packages/*/package.json; do
            # Update package version
            update_version "$pkg" "${{ steps.get_version.outputs.VERSION }}"
            
            # Update internal dependencies
            for dep in core client server nestjs; do
              if grep -q "\"@ts-socketio/$dep\"" "$pkg"; then
                update_dependency "$pkg" "@ts-socketio/$dep" "${{ steps.get_version.outputs.VERSION }}"
              fi
            done
          done
      
      - name: Publish packages
        run: |
          if [[ "${{ steps.get_version.outputs.IS_RELEASE }}" == "true" ]]; then
            # For official releases, publish without beta tag
            for pkg in packages/*; do
              cd $pkg
              yarn publish --new-version ${{ steps.get_version.outputs.VERSION }} --no-git-tag-version
              cd ../..
            done
          else
            # For develop branch, publish with latest tag
            for pkg in packages/*; do
              cd $pkg
              yarn publish --new-version ${{ steps.get_version.outputs.VERSION }} --tag latest --no-git-tag-version
              cd ../..
            done
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Commit and push version changes
        run: |
          git add .
          git commit -m "chore: bump version to ${{ steps.get_version.outputs.VERSION }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push tag for releases
        if: steps.get_version.outputs.IS_RELEASE == 'true'
        run: |
          git tag -a "v${{ steps.get_version.outputs.VERSION }}" -m "Release v${{ steps.get_version.outputs.VERSION }}"
          git push origin "v${{ steps.get_version.outputs.VERSION }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 